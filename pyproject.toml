[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnivoice"
version = "0.2.0"
description = "Universal voice AI agent for keyboard operations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "comtypes>=1.4.8",
    "pydantic-ai-slim[google,groq,openai]==2.45.0",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.10",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.2",
    "sounddevice>=0.5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[project.scripts]
omnivoice = "omnivoice.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "windows_integration: opt-in tests that interact with the Windows desktop",
]
