# OmniVoice configuration.
# Add AI models as alias: "provider:model-name" and choose default_model.
# API keys belong in the separate .env credentials file.

agent:
  default_model: "gemini-flash"
  models:
    gemini-flash: "google:gemini-3.8-flash"
    claude: "anthropic:claude-sonnet-4-5"
    openai: "openai:gpt-5"
    groq-fast: "groq:openai/gpt-oss-20b"
    groq-large: "groq:openai/gpt-oss-120b"
    ollama-local: "ollama:qwen3:8b"
  context:
    # "off" disables UI context at startup; "uia" enables it persistently.
    mode: "off"

hotkey:
  push_to_talk: "ctrl+alt+space"
  agent_push_to_talk: "ctrl+alt+shift+space"

speech:
  stt:
    # Local whisper.cpp model: setup installs small.en. Other models require
    # a matching ggml-MODEL.bin file in %LOCALAPPDATA%\OmniVoice\speech\models.
    model: "small.en"
  tts:
    # Installed Windows SAPI voice for short status messages.
    voice: "Microsoft Zira Desktop"
