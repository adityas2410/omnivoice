agent:
  default_model: "gemini-flash"
  models:
    gemini-flash: "google:gemini-3.8-flash"
    claude: "anthropic:claude-sonnet-4-5"
    openai: "openai:gpt-5"
    groq-fast: "groq:openai/gpt-oss-20b"
    groq-large: "groq:openai/gpt-oss-120b"
    ollama-local: "ollama:qwen3:8b"
  context:
    # "off" disables UI context at startup; "uia" enables it persistently.
    mode: "off"

hotkey:
  push_to_talk: "ctrl+alt+space"
  agent_push_to_talk: "ctrl+alt+shift+space"

speech:
  stt:
    enabled: true
    provider: "whisper_cpp"
    model: "small.en"
    language: "en"
    timeout_seconds: 60
    threads: null
    executable_path: null
    model_path: null
  tts:
    enabled: true
    provider: "windows_sapi"
    voice: "Microsoft Zira Desktop"
    rate: 0
    volume: 100
  microphone:
    device: null
  recording:
    max_seconds: 30
    sample_rate: 16000
    minimum_seconds: 0.15
    silence_rms_threshold: 80
