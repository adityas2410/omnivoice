agent:
  default_model: "gemini-flash"
  models:
    gemini-flash:
      selector: "google:gemini-3.8-flash"
      input_token_budget: 1000000
    claude:
      selector: "anthropic:claude-sonnet-4-5"
      input_token_budget: 200000
    openai:
      selector: "openai:gpt-5"
      input_token_budget: 400000
    groq-fast:
      selector: "groq:openai/gpt-oss-20b"
      input_token_budget: 100000
    groq-large: "groq:openai/gpt-oss-120b"
    ollama-local:
      selector: "ollama:qwen3:8b"
      input_token_budget: 12000
  context:
    # "off" disables UI context at startup; "uia" enables it persistently.
    mode: "off"
    # Maximum characters of document/page text sent as context.
    document_max_characters: 50000
    # Maximum serialized characters in the semantic UI Automation outline.
    semantic_max_characters: 20000
    # Maximum UI Automation elements inspected for the semantic outline.
    semantic_max_elements: 500
    # Maximum UI Automation hierarchy depth inspected.
    semantic_max_depth: 16
    # Maximum document characters before the current caret or selection.
    target_before_max_characters: 16000
    # Maximum document characters after the current caret or selection.
    target_after_max_characters: 8000
    # Maximum seconds spent capturing UI context for one agent request.
    capture_timeout_seconds: 5

hotkey:
  push_to_talk: "ctrl+alt+space"
  agent_push_to_talk: "ctrl+alt+shift+space"

speech:
  stt:
    enabled: true
    provider: "whisper_cpp"
    model: "small.en"
    language: "en"
    timeout_seconds: 60
    threads: null
    executable_path: null
    model_path: null
  tts:
    enabled: true
    provider: "windows_sapi"
    voice: "Microsoft Zira Desktop"
    rate: 0
    volume: 100
  microphone:
    device: null
  recording:
    max_seconds: 30
    sample_rate: 16000
    minimum_seconds: 0.15
    silence_rms_threshold: 80
